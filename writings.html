    function renderCards(filter = 'all') {
      const grid = document.getElementById('cardsGrid');
      grid.innerHTML = '';

      const filtered = essaysData.filter(item => filter === 'all' || item.type === filter);

      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = 'essay-card';

        const badgeClass = item.type;

        card.innerHTML = `
          <div class="card-header">
            <div class="card-top-row">
              <h3 class="essay-title">${escapeHtml(item.title)}</h3>
              <span class="type-badge ${badgeClass}">${item.type}</span>
            </div>
            <div class="meta-line">
              <span class="course-tag">${escapeHtml(item.course)}</span>
              <span class="date-tag">• ${escapeHtml(item.date)}</span>
            </div>
          </div>
          <div class="card-body">
            <iframe src="${item.embed_url}" loading="lazy" allowfullscreen></iframe>
          </div>
          <div class="card-footer">
            <span style="font-size: 0.8rem; color: var(--text-muted);">${escapeHtml(item.quarter)}</span>
            <a href="${item.url}" target="_blank" rel="noopener" class="ext-link">Open Full Document ↗</a>
          </div>
        `;

        grid.appendChild(card);
      });
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function filterType(type) {
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.remove('active');
        if (btn.textContent.toLowerCase().includes(type) || (type === 'all' && btn.textContent === 'All')) {
          btn.classList.add('active');
        }
      });
      renderCards(type);
    }

    // Initial render
    renderCards();
  </script>
