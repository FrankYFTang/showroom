    "embed_url": "https://docs.google.com/presentation/d/1J7Qdm6dm2smtzydl7BSw6KTXRY7At5IDe9-tdqQlD38/embed?start=false&loop=false&delayms=3000",
    "type": "slide",
    "cover_image": "https://drive.google.com/thumbnail?id=1J7Qdm6dm2smtzydl7BSw6KTXRY7At5IDe9-tdqQlD38&sz=w800"
  }
];

    function renderCards(filter = 'all') {
      const grid = document.getElementById('cardsGrid');
      grid.innerHTML = '';

      const filtered = essaysData.filter(item => filter === 'all' || item.type === filter);
      document.getElementById('countTag').textContent = `${filtered.length} Essays`;

      filtered.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'essay-card';
        card.onclick = () => openModal(item);

        const badgeClass = item.type;
        
        let coverHtml = '';
        if (item.cover_image) {
          coverHtml = `
            <div class="cover-container">
              <span class="type-badge ${badgeClass}">${item.type}</span>
              <img src="${item.cover_image}" alt="${escapeHtml(item.title)}" class="cover-img" onerror="this.parentElement.innerHTML='${escapeHtml(getFallbackCover(item))}'">
            </div>`;
        } else {
          coverHtml = `
            <div class="cover-container">
              <span class="type-badge ${badgeClass}">${item.type}</span>
              ${getFallbackCover(item)}
            </div>`;
        }

        card.innerHTML = `
          ${coverHtml}
          <div class="card-body">
            <div class="course-meta">${escapeHtml(item.course)}</div>
            <h3 class="essay-title">${escapeHtml(item.title)}</h3>
            <div class="date-meta">
              <span>📅 ${escapeHtml(item.date)}</span>
              <span class="view-prompt">Click to Read ↗</span>
            </div>
          </div>
        `;

        grid.appendChild(card);
      });
    }

    function getFallbackCover(item) {
      let icon = '📄';
      if (item.type === 'pdf') icon = '📑';
      if (item.type === 'slide') icon = '📊';

      return `<div class="fallback-cover">
        <div class="fallback-icon">${icon}</div>
        <div class="fallback-title">${escapeHtml(item.title)}</div>
      </div>`;
    }

    function openModal(item) {
      document.getElementById('modalTitle').textContent = item.title;
      document.getElementById('modalSubtitle').textContent = `${item.course} • ${item.date}`;
      document.getElementById('modalQuarter').textContent = item.quarter;
      document.getElementById('modalExtLink').href = item.url;

      const container = document.getElementById('modalIframeContainer');
      container.innerHTML = `<iframe src="${item.embed_url}" allowfullscreen></iframe>`;

      const modal = document.getElementById('essayModal');
      modal.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeModal(event) {
      if (event && event.target !== event.currentTarget && !event.target.classList.contains('modal-close')) return;
      const modal = document.getElementById('essayModal');
      modal.classList.remove('open');
      document.getElementById('modalIframeContainer').innerHTML = '';
      document.body.style.overflow = 'auto';
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function filterType(type) {
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.remove('active');
        if (btn.textContent.toLowerCase().includes(type) || (type === 'all' && btn.textContent === 'All')) {
          btn.classList.add('active');
        }
      });
      renderCards(type);
    }

    // Close modal on Escape key
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });

    // Initial render
    renderCards();
  </script>
</body>
</html>
